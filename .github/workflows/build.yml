name: Build and Release

on:
  push:
    branches-ignore: [Pre-release-shadPS4-*]
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  pull_request:
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  BUILD_TYPE: Release

jobs:
  get-info:
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
    - uses: actions/checkout@v6
    - name: Get date and git hash
      id: vars
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # Combined single-file Windows build: clang-cl + Ninja, both cores .incbin-embedded
  # into ONE self-contained shadps4.exe (static CRT, no sidecar DLLs). The dispatcher
  # selects core_gr2 / core_main at runtime by the launched title id, same as Linux.
  windows-sdl:
    runs-on: windows-latest
    needs: get-info
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    # clang-cl needs the MSVC headers/libs (INCLUDE/LIB) on PATH; this also makes
    # clang-cl available as the C/CXX *and* ASM compiler for the GAS-syntax .S stubs.
    - name: Setup MSVC environment (Windows)
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Cache CMake Configuration
      uses: actions/cache@v5
      env:
          cache-name: ${{ runner.os }}-sdl-ninja-cache-cmake-configuration
      with:
          path: |
            ${{github.workspace}}/build
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ env.cache-name }}-

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.21
      env:
          cache-name: ${{ runner.os }}-sdl-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

    - name: Print CPU Info
      run: bash -c "cat /proc/cpuinfo"

    # COMBINED_EMBED_CORES=ON -> single self-contained exe; static CRT so the temp-
    # extracted core needs no vcruntime DLL beside it; ASM pinned to clang-cl so the
    # .incbin embed stub (and the cores' fiber/stack .s/.S) is NOT routed to MASM.
    # IPO ON = clang-cl ThinLTO. -fuse-ld=lld is REQUIRED: the MSVC link.exe can't
    # consume LLVM bitcode, so the LTO link must go through lld-link (ships with the
    # LLVM that provides clang-cl on windows-latest). Release already implies /O2
    # /DNDEBUG under clang-cl (MSVC has no /O3), so IPO is the optimization lever here.
    # JOB_POOLS link=1 serializes the link step so the two big ThinLTO core-links don't
    # run concurrently and blow past runner RAM (compiles still fully parallel).
    - name: Configure CMake
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCOMBINED_EMBED_CORES=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_ASM_COMPILER=clang-cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $env:NUMBER_OF_PROCESSORS

    # Verify the single-file guarantee: the temp-extracted core must depend on only
    # system DLLs. Informational (does not fail the build) -- the cores are built
    # static, so this is the check most likely to reveal a stray external DLL dep.
    - name: Verify core DLL self-containment (dumpbin /dependents)
      continue-on-error: true
      shell: cmd
      run: |
        if exist "${{github.workspace}}\build\libcore_gr2.dll" dumpbin /dependents "${{github.workspace}}\build\libcore_gr2.dll"
        if exist "${{github.workspace}}\build\libcore_main.dll" dumpbin /dependents "${{github.workspace}}\build\libcore_main.dll"

    - name: Upload Windows SDL artifact
      uses: actions/upload-artifact@v7
      with:
        name: shadps4-combined-win64-sdl-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: ${{github.workspace}}/build/shadps4.exe

  # RelWithDebInfo variant of the same combined single-file exe, gated on the normal
  # (Release) windows-sdl job via `needs:` so the two heavy Windows builds run in
  # series, not in parallel. Build type is RelWithDebInfo = optimized (/O2 /Ob1
  # /DNDEBUG, asserts off like Release) PLUS /Zi debug info, and lld-link emits a PDB
  # per binary. IPO/ThinLTO is intentionally NOT enabled here: LTO inlining shreds
  # stack frames and locals, which defeats the point of a debuggable build, and it
  # would compound the link memory of an already-heavy debuginfo build. (Add
  # -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELWITHDEBINFO=ON if you want it to match the
  # Release codegen exactly.) lld kept for linker parity with windows-sdl; JOB_POOLS
  # link=1 still serializes the (large, debuginfo) core links. Uploads the exe + every
  # PDB (shadps4.pdb + libcore_{gr2,main}.pdb) so embedded-core crashes can be symbolized.
  windows-sdl-relwithdebinfo:
    runs-on: windows-latest
    needs: [get-info, windows-sdl]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSVC environment (Windows)
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Cache CMake Configuration
      uses: actions/cache@v5
      env:
          cache-name: ${{ runner.os }}-sdl-relwithdebinfo-cache-cmake-configuration
      with:
          path: |
            ${{github.workspace}}/build
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ env.cache-name }}-

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.21
      env:
          cache-name: ${{ runner.os }}-sdl-relwithdebinfo-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

    - name: Print CPU Info
      run: bash -c "cat /proc/cpuinfo"

    # Same as windows-sdl but CMAKE_BUILD_TYPE=RelWithDebInfo and no IPO (see job comment).
    - name: Configure CMake
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCOMBINED_EMBED_CORES=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_ASM_COMPILER=clang-cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config RelWithDebInfo --parallel $env:NUMBER_OF_PROCESSORS

    # Informational: the debug exe must also depend on only system DLLs.
    - name: Verify core DLL self-containment (dumpbin /dependents)
      continue-on-error: true
      shell: cmd
      run: |
        if exist "${{github.workspace}}\build\libcore_gr2.dll" dumpbin /dependents "${{github.workspace}}\build\libcore_gr2.dll"
        if exist "${{github.workspace}}\build\libcore_main.dll" dumpbin /dependents "${{github.workspace}}\build\libcore_main.dll"

    - name: Upload Windows SDL RelWithDebInfo artifact
      uses: actions/upload-artifact@v7
      with:
        name: shadps4-combined-win64-sdl-relwithdebinfo-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: |
          ${{github.workspace}}/build/shadps4.exe
          ${{github.workspace}}/build/*.pdb

  linux-sdl:
    runs-on: ubuntu-24.04
    needs: get-info
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Add LLVM repository
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'

    - name: Install dependencies
      run: sudo apt-get update && sudo apt install -y libx11-dev libxext-dev libwayland-dev libdecor-0-dev libxkbcommon-dev libglfw3-dev libgles2-mesa-dev libfuse2 clang-19 lld-19 ninja-build build-essential libasound2-dev libpulse-dev libopenal-dev libudev-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev

    # The cached build/ dir pins CMAKE_GENERATOR in its CMakeCache.txt. This job now
    # uses -G Ninja (it was Unix Makefiles upstream), so the cache-name carries `ninja`
    # to bust any stale Makefiles build/ -- otherwise the restored cache makes CMake
    # refuse to switch generators ("does not match the generator used previously").
    - name: Cache CMake Configuration
      uses: actions/cache@v5
      env:
          cache-name: ${{ runner.os }}-sdl-ninja-cache-cmake-configuration
      with:
          path: |
            ${{github.workspace}}/build
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ env.cache-name }}-

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.21
      env:
          cache-name: ${{ runner.os }}-sdl-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

    - name: Print CPU Info
      run: cat /proc/cpuinfo

    # COMBINED_EMBED_CORES=ON -> ONE self-contained shadps4 ELF with both cores
    # .incbin-embedded (gr2 + prerelease), runtime-selected by title id, exactly like
    # the Windows build. On Linux gas handles .incbin natively, so no ASM-compiler pin
    # is needed (that is a Windows/MASM-only concern).
    # Optimized build: -O3 -DNDEBUG + ThinLTO (-flto=thin), lld as the LTO linker
    # (clang-19's sibling ld.lld; matches build-appimage.sh's BUILD=1 path). -G Ninja
    # so JOB_POOLS link=1 can serialize the link step — keeps the two big ThinLTO
    # core-links from running concurrently and OOM'ing the runner (compiles stay fully
    # parallel). Arch left generic (NO -march=x86-64-v3) so the artifact stays portable;
    # add -DCMAKE_C/CXX_FLAGS=-march=... locally for a tuned build.
    - name: Configure CMake
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCOMBINED_EMBED_CORES=ON -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin" -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin" -DCMAKE_EXE_LINKER_FLAGS="-flto=thin -fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $(nproc)

    # Confirm the embed build produced the single self-contained binary + the loose
    # cores (the .incbin inputs, also the dep-collection inputs for build-appimage.sh).
    - name: Verify combined embed build
      run: |
        ls -la ${{github.workspace}}/build/shadps4 ${{github.workspace}}/build/libcore_gr2.so ${{github.workspace}}/build/libcore_main.so
        echo "shadps4 size: $(( $(stat -c%s ${{github.workspace}}/build/shadps4) / 1024 / 1024 )) MB (embed build is large; a tiny binary means a DEV build)"

    # Upload the raw self-contained ELF (both cores baked in, no sidecars needed).
    - uses: actions/upload-artifact@v7
      with:
        name: shadps4-ubuntu64-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: ${{github.workspace}}/build/shadps4

    # Package an AppImage with the combined-aware script (NOT the old upstream
    # linux-appimage-sdl.sh, which does a naive `linuxdeploy --executable` that cannot
    # see the embedded cores' deps). BUILD_DIR points it at the already-built embed
    # tree (no rebuild, no BUILD=1); it bundles SDL3/FFmpeg/OpenAL/etc. from the loose
    # cores, drops the redundant cores, and writes a custom AppRun that exports
    # LD_LIBRARY_PATH so the memfd-dlopened core resolves its bundled deps.
    - name: Package AppImage (combined embed)
      run: BUILD_DIR=${{github.workspace}}/build OUT=${{github.workspace}}/build/shadPS4-combined-x86_64.AppImage ./build-appimage.sh

    - uses: actions/upload-artifact@v7
      with:
        name: shadps4-linux-sdl-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: ${{github.workspace}}/build/shadPS4-combined-x86_64.AppImage

  pre-release:
    if: github.ref == 'refs/heads/main' && github.repository == 'shadps4-emu/shadPS4' && github.event_name == 'push'
    needs: [get-info, windows-sdl, linux-sdl]
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts

    - name: Make SDL artifacts executable
      run: |
        chmod -R a+x ./artifacts/shadps4-linux-sdl-*

    - name: Compress individual directories (without parent directory)
      run: |
        cd ./artifacts
        for dir in */; do
          if [ -d "$dir" ]; then
            dir_name=${dir%/}
            echo "Creating zip for $dir_name"
            (cd "$dir_name" && zip -r "../${dir_name}.zip" .)
          fi
        done

    - name: Get latest release information
      id: get_latest_release
      env:
        GITHUB_TOKEN: ${{ secrets.SHADPS4_TOKEN_REPO }}
      run: |
        api_url="https://api.github.com/repos/${{ github.repository }}"
        latest_release_info=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url/releases/latest")
        echo "last_release_tag=$(echo "$latest_release_info" | jq -r '.tag_name')" >> $GITHUB_ENV

    - name: Create Pre-Release on GitHub
      id: create_release
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.SHADPS4_TOKEN_REPO }}
        name: "Pre-release-shadPS4-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
        tag: "Pre-release-shadPS4-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.fullhash }}"
        draft: false
        prerelease: true
        body: "Full Changelog: [${{ env.last_release_tag }}...${{ needs.get-info.outputs.shorthash }}](https://github.com/shadps4-emu/shadPS4/compare/${{ env.last_release_tag }}...${{ needs.get-info.outputs.fullhash }})"
        artifacts: ./artifacts/*.zip

    - name: Publish to Release Repository
      env:
        GITHUB_TOKEN: ${{ secrets.SHADPS4_TOKEN_REPO }}
      run: |
        ARTIFACTS_DIR=./artifacts
        REPO_WINDOWS="shadps4-emu/shadps4-binaries-Windows"
        REPO_LINUX="shadps4-emu/shadps4-binaries-Linux"

        for file in "$ARTIFACTS_DIR"/*.zip; do
          filename=$(basename "$file")
          REPO=""

          # Determine repository based on file name
          if [[ "$filename" == *"win64"* ]]; then
            REPO=$REPO_WINDOWS
          elif [[ "$filename" == *"linux"* ]] || [[ "$filename" == *"ubuntu64"* ]]; then
            REPO=$REPO_LINUX
          fi

          # If REPO is empty, skip file
          if [[ -z "$REPO" ]]; then
            echo "No matching repository for $filename"
            continue
          fi

          # Check if release already exists and get ID
          release_id=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/Pre-release-shadPS4-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.fullhash }}" | jq -r '.id')

          if [[ "$release_id" == "null" ]]; then
            echo "Creating release in $REPO for $filename"
            release_id=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -d '{
                "tag_name": "Pre-release-shadPS4-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.fullhash }}",
                "name": "Pre-release-shadPS4-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}",
                "draft": false,
                "prerelease": true,
                "body": "Commit: [${{ needs.get-info.outputs.fullhash }}](https://github.com/shadps4-emu/shadPS4/commit/${{ needs.get-info.outputs.fullhash }})"
              }' "https://api.github.com/repos/$REPO/releases" | jq -r '.id')
          else
            echo "Release already exists in $REPO with ID $release_id"
          fi

          # Artifact upload
          echo "Uploading $filename to release $release_id in $REPO"
          upload_url="https://uploads.github.com/repos/$REPO/releases/$release_id/assets?name=$filename"
          curl -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$file" "$upload_url"
        done

    - name: Get current pre-release information
      env:
        GITHUB_TOKEN: ${{ secrets.SHADPS4_TOKEN_REPO }}
      run: |
        api_url="https://api.github.com/repos/${{ github.repository }}/releases"

        # Get all releases (sorted by date)
        releases=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url")

        # Capture the most recent pre-release (assuming the first one is the latest)
        current_release=$(echo "$releases" | jq -c '.[] | select(.prerelease == true) | .published_at' | sort -r | head -n 1)

        # Remove extra quotes from captured date
        current_release=$(echo $current_release | tr -d '"')

        # Export the current published_at to be available for the next step
        echo "CURRENT_PUBLISHED_AT=$current_release" >> $GITHUB_ENV

    - name: Delete old pre-releases and tags
      env:
        GITHUB_TOKEN: ${{ secrets.SHADPS4_TOKEN_REPO }}
      run: |
        api_url="https://api.github.com/repos/${{ github.repository }}/releases"

        # Get current pre-releases
        releases=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url")

        # Remove extra quotes from captured date
        CURRENT_PUBLISHED_AT=$(echo $CURRENT_PUBLISHED_AT | tr -d '"')

        # Convert CURRENT_PUBLISHED_AT para timestamp Unix
        current_published_ts=$(date -d "$CURRENT_PUBLISHED_AT" +%s)

        # Identify pre-releases
        echo "$releases" | jq -c '.[] | select(.prerelease == true)' | while read -r release; do
          release_date=$(echo "$release" | jq -r '.published_at')
          release_id=$(echo "$release" | jq -r '.id')
          release_tag=$(echo "$release" | jq -r '.tag_name')

          # Remove extra quotes from captured date
          release_date=$(echo $release_date | tr -d '"')

          # Convert release_date para timestamp Unix
          release_date_ts=$(date -d "$release_date" +%s)

          # Compare timestamps and delete old pre-releases
          if [[ "$release_date_ts" -lt "$current_published_ts" ]]; then
            echo "Deleting old pre-release: $release_id from $release_date with tag: $release_tag"
            # Delete the pre-release
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" "$api_url/$release_id"
            # Delete the tag
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$release_tag"
          else
            echo "Skipping pre-release: $release_id (newer or same date)"
          fi
        done
