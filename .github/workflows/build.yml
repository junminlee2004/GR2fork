name: Build and Release

on:
  push:
    branches-ignore: [Pre-release-shadPS4-*]
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  pull_request:
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  BUILD_TYPE: Release

jobs:
  get-info:
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
    - uses: actions/checkout@v6
    - name: Get date and git hash
      id: vars
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  windows-sdl:
    runs-on: windows-latest
    needs: get-info
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSVC environment (Windows)
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Cache CMake Configuration
      uses: actions/cache@v5
      env:
          cache-name: ${{ runner.os }}-sdl-ninja-cache-cmake-configuration
      with:
          path: |
            ${{github.workspace}}/build
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'packaging/gr2.prof', 'packaging/gr2win.profdata') }}
          restore-keys: |
            ${{ env.cache-name }}-

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.21
      env:
          cache-name: ${{ runner.os }}-sdl-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'packaging/gr2.prof', 'packaging/gr2win.profdata') }}

    - name: Print CPU Info
      run: bash -c "cat /proc/cpuinfo"


    - name: Configure CMake
      # GR2FORK CI FIX (profdata/ccache consistency): the profile is passed as
      # /clang:-fprofile-use=<path>; ccache hashes the command-line PATH but not the profdata
      # CONTENT (the /clang: escape hides it, and CCACHE_EXTRAFILES did not take effect). So a
      # profdata update with the same path served STALE bitcode (old PGO ProfileSummary) for cache
      # hits while misses rebuilt against the new profile - ThinLTO then linked mismatched
      # ProfileSummary modules and died ("IDs have conflicting values", on protoc first, then
      # core_gr2 vs fmt). Fix: bake the profdata's SHA256 into a (unused) /D define that IS on the
      # command line, so any profdata change flips the hash and forces EVERY profiled object -
      # core AND all externals - to rebuild consistently. Non-profdata pushes still hit the cache.
      # (Local has no ccache, so it is always a single-profile build - hence always green.)
      # GLOBAL PGO, matching the local reference build (measured ~3fps faster than core_gr2-only
      # scoping): the profile reaches every statically linked external (bundled SDL3, zlib-ng,
      # imgui, ...) plus uniform /MT+LTO flags. -Wno-profile-instr-* silences unprofiled/stale-hash
      # code; -Wno-backend-plugin guards the zlib-ng /WX hash-mismatch failure seen on CI clang.
      # DISABLE_FIND_PACKAGE_SDL3 forces the bundled SDL3 so it builds with these same flags.
      # Forward-slash the path: ${{github.workspace}} is a backslash path on Windows (D:\a\...)
      # and CMake would mis-read \a as an invalid escape in the -D value.
      run: |
        $prof = "${{github.workspace}}/packaging/gr2win.profdata".Replace('\','/')
        $phash = (Get-FileHash -Algorithm SHA256 "$prof").Hash
        $pgo = "/clang:-fprofile-use=$prof /clang:-Wno-profile-instr-unprofiled /clang:-Wno-profile-instr-out-of-date /clang:-Wno-backend-plugin /DGR2_PGO_HASH=$phash"
        cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCOMBINED_EMBED_CORES=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_ASM_COMPILER=clang-cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON "-DCMAKE_C_FLAGS=/DWIN32 /D_WINDOWS $pgo" "-DCMAKE_CXX_FLAGS=/DWIN32 /D_WINDOWS /EHsc $pgo" -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $env:NUMBER_OF_PROCESSORS

    - name: Verify core DLL self-containment (dumpbin /dependents)
      continue-on-error: true
      shell: cmd
      run: |
        if exist "${{github.workspace}}\build\libcore_gr2.dll" dumpbin /dependents "${{github.workspace}}\build\libcore_gr2.dll"
        if exist "${{github.workspace}}\build\libcore_main.dll" dumpbin /dependents "${{github.workspace}}\build\libcore_main.dll"

    - name: Rename Windows binary
      run: Move-Item -Force "${{github.workspace}}/build/shadps4.exe" "${{github.workspace}}/build/shadps4gr2fork.exe"

    - name: Upload Windows SDL artifact
      uses: actions/upload-artifact@v7
      with:
        name: shadps4-combined-win64-sdl-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: ${{github.workspace}}/build/shadps4gr2fork.exe

  windows-sdl-relwithdebinfo:
    runs-on: windows-latest
    needs: [get-info, windows-sdl]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSVC environment (Windows)
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Cache CMake Configuration
      uses: actions/cache@v5
      env:
          cache-name: ${{ runner.os }}-sdl-relwithdebinfo-cache-cmake-configuration
      with:
          path: |
            ${{github.workspace}}/build
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'packaging/gr2.prof', 'packaging/gr2win.profdata') }}
          restore-keys: |
            ${{ env.cache-name }}-

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.21
      env:
          cache-name: ${{ runner.os }}-sdl-relwithdebinfo-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'packaging/gr2.prof', 'packaging/gr2win.profdata') }}

    - name: Print CPU Info
      run: bash -c "cat /proc/cpuinfo"

    - name: Configure CMake
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCOMBINED_EMBED_CORES=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_ASM_COMPILER=clang-cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config RelWithDebInfo --parallel $env:NUMBER_OF_PROCESSORS

    - name: Verify core DLL self-containment (dumpbin /dependents)
      continue-on-error: true
      shell: cmd
      run: |
        if exist "${{github.workspace}}\build\libcore_gr2.dll" dumpbin /dependents "${{github.workspace}}\build\libcore_gr2.dll"
        if exist "${{github.workspace}}\build\libcore_main.dll" dumpbin /dependents "${{github.workspace}}\build\libcore_main.dll"

    - name: Upload Windows SDL RelWithDebInfo artifact
      uses: actions/upload-artifact@v7
      with:
        name: shadps4-combined-win64-sdl-relwithdebinfo-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: |
          ${{github.workspace}}/build/shadps4.exe
          ${{github.workspace}}/build/*.pdb

  linux-sdl:
    runs-on: ubuntu-24.04
    needs: get-info
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Add LLVM repository
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'

    - name: Install dependencies
      run: sudo apt-get update && sudo apt install -y libx11-dev libxext-dev libwayland-dev libdecor-0-dev libxkbcommon-dev libglfw3-dev libgles2-mesa-dev libfuse2 clang-19 lld-19 ninja-build build-essential libasound2-dev libpulse-dev libopenal-dev libudev-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev

    - name: Cache CMake Configuration
      uses: actions/cache@v5
      env:
          cache-name: ${{ runner.os }}-sdl-ninja-cache-cmake-configuration
      with:
          path: |
            ${{github.workspace}}/build
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'packaging/gr2.prof', 'packaging/gr2win.profdata') }}
          restore-keys: |
            ${{ env.cache-name }}-

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.21
      env:
          cache-name: ${{ runner.os }}-sdl-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'packaging/gr2.prof', 'packaging/gr2win.profdata') }}

    - name: Print CPU Info
      run: cat /proc/cpuinfo


    - name: Configure CMake
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCOMBINED_EMBED_CORES=ON -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_C_FLAGS="-O3 -DNDEBUG -flto=thin" -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -flto=thin" -DCMAKE_EXE_LINKER_FLAGS="-flto=thin -fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" -DGR2_SAMPLE_PROFILE=${{github.workspace}}/packaging/gr2.prof -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $(nproc)

    - name: Verify combined embed build
      run: |
        ls -la ${{github.workspace}}/build/shadps4 ${{github.workspace}}/build/libcore_gr2.so ${{github.workspace}}/build/libcore_main.so
        echo "shadps4 size: $(( $(stat -c%s ${{github.workspace}}/build/shadps4) / 1024 / 1024 )) MB (embed build is large; a tiny binary means a DEV build)"

    - uses: actions/upload-artifact@v7
      with:
        name: shadps4-ubuntu64-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: ${{github.workspace}}/build/shadps4


    - name: Package AppImage (combined embed)
      run: BUILD_DIR=${{github.workspace}}/build OUT=${{github.workspace}}/build/shadPS4-combined-x86_64.AppImage ./build-appimage.sh


    - name: Rename AppImage
      run: mv "${{github.workspace}}/build/shadPS4-combined-x86_64.AppImage" "${{github.workspace}}/build/shadps4gr2fork.AppImage"

    - uses: actions/upload-artifact@v7
      with:
        name: shadps4-linux-sdl-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: ${{github.workspace}}/build/shadps4gr2fork.AppImage

  pre-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/gr2fork-main')
    needs: [get-info, windows-sdl, linux-sdl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    - name: Checkout (for the committed launcher folders)
      uses: actions/checkout@v6
      with:
        lfs: true

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts


    - name: Bundle launcher + core
      run: |
        set -e
        DATE=${{ needs.get-info.outputs.date }}
        HASH=${{ needs.get-info.outputs.shorthash }}

        # The filename each launcher expects the emulator under, inside its folder:
        WIN_CORE_NAME="shadps4gr2fork.exe"        # what GR2Launcher.exe launches
        LIN_CORE_NAME="shadps4gr2fork.AppImage"   # what GR2Launcher.appimage launches

        WIN_CORE="./artifacts/shadps4-combined-win64-sdl-${DATE}-${HASH}/shadps4gr2fork.exe"
        LIN_CORE="./artifacts/shadps4-linux-sdl-${DATE}-${HASH}/shadps4gr2fork.AppImage"
        test -f "$WIN_CORE" || { echo "missing windows core: $WIN_CORE"; ls -R ./artifacts; exit 1; }
        test -f "$LIN_CORE" || { echo "missing linux appimage: $LIN_CORE"; ls -R ./artifacts; exit 1; }

        # Windows bundle
        WIN_DIR="GR2fork-win64-${DATE}-${HASH}"
        rm -rf stage-win && mkdir -p "stage-win/${WIN_DIR}"
        cp -r packaging/GR2fork_Windows/. "stage-win/${WIN_DIR}/"
        cp "$WIN_CORE" "stage-win/${WIN_DIR}/${WIN_CORE_NAME}"
        mkdir -p "stage-win/${WIN_DIR}/user/sys_modules"     # portable-mode anchor (-> ./user, not AppData)
        (cd stage-win && zip -r "../${WIN_DIR}.zip" .)

        # Linux bundle (chmod +x the emulator AppImage and the launcher AppImage so the
        # executable bit survives the zip)
        LIN_DIR="GR2fork-linux64-${DATE}-${HASH}"
        rm -rf stage-lin && mkdir -p "stage-lin/${LIN_DIR}"
        cp -r packaging/GR2fork_Linux/. "stage-lin/${LIN_DIR}/"
        cp "$LIN_CORE" "stage-lin/${LIN_DIR}/${LIN_CORE_NAME}"
        chmod +x "stage-lin/${LIN_DIR}/${LIN_CORE_NAME}"
        chmod +x "stage-lin/${LIN_DIR}/"*.appimage "stage-lin/${LIN_DIR}/"*.AppImage 2>/dev/null || true
        mkdir -p "stage-lin/${LIN_DIR}/user/sys_modules"     # portable-mode anchor (-> ./user, not ~/.local/share)
        (cd stage-lin && zip -r "../${LIN_DIR}.zip" .)

        ls -la *.zip

    - name: Get latest release information
      id: get_latest_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        api_url="https://api.github.com/repos/${{ github.repository }}"
        latest_release_info=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url/releases/latest")
        echo "last_release_tag=$(echo "$latest_release_info" | jq -r '.tag_name')" >> $GITHUB_ENV

    - name: Create Pre-Release on GitHub
      id: create_release
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: "Pre-release-GR2fork-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
        tag: "Pre-release-GR2fork-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.fullhash }}"
        draft: false
        prerelease: true
        allowUpdates: true
        body: "Full Changelog: [${{ env.last_release_tag }}...${{ needs.get-info.outputs.shorthash }}](https://github.com/${{ github.repository }}/compare/${{ env.last_release_tag }}...${{ needs.get-info.outputs.fullhash }})"
        artifacts: "GR2fork-win64-*.zip,GR2fork-linux64-*.zip"

    - name: Get current pre-release information
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        api_url="https://api.github.com/repos/${{ github.repository }}/releases"
        releases=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url")
        current_release=$(echo "$releases" | jq -c '.[] | select(.prerelease == true) | .published_at' | sort -r | head -n 1)
        current_release=$(echo $current_release | tr -d '"')
        echo "CURRENT_PUBLISHED_AT=$current_release" >> $GITHUB_ENV

    - name: Delete old pre-releases and tags
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        api_url="https://api.github.com/repos/${{ github.repository }}/releases"
        releases=$(curl -H "Authorization: token $GITHUB_TOKEN" "$api_url")
        CURRENT_PUBLISHED_AT=$(echo $CURRENT_PUBLISHED_AT | tr -d '"')
        current_published_ts=$(date -d "$CURRENT_PUBLISHED_AT" +%s)
        echo "$releases" | jq -c '.[] | select(.prerelease == true)' | while read -r release; do
          release_date=$(echo "$release" | jq -r '.published_at')
          release_id=$(echo "$release" | jq -r '.id')
          release_tag=$(echo "$release" | jq -r '.tag_name')
          release_date=$(echo $release_date | tr -d '"')
          release_date_ts=$(date -d "$release_date" +%s)
          if [[ "$release_date_ts" -lt "$current_published_ts" ]]; then
            echo "Deleting old pre-release: $release_id ($release_tag)"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" "$api_url/$release_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$release_tag"
          else
            echo "Skipping pre-release: $release_id (newer or same date)"
          fi
        done
